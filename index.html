                "@type": "Question",
                "name": "When is TDS under Section 194-IA mandatory?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "TDS under Section 194-IA is mandatory whenever a resident buyer purchases immovable property (other than agricultural land) worth ₹50,00,000 or more. The statutory deduction rate is 1% of the higher of the Agreement Value or the Stamp Duty Value (Circle Rate)."
                }
              },
              {
                "@type": "Question",
                "name": "Do joint buyers and co-sellers need separate Form 26QB filings?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. A distinct Form 26QB must be filed for every unique buyer-seller pair (N_buyers × N_sellers). For instance, 2 buyers purchasing from 2 sellers requires exactly 4 distinct challan filings."
                }
              },
              {
                "@type": "Question",
                "name": "What is the penalty for late filing of Form 26QB?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Under Section 234E, a late filing fee of ₹200 per day is levied for each day of delay beyond 30 days from the end of the transaction month, capped at the total TDS amount. Additionally, simple interest is charged at 1.5% per month or part of a month under Section 201(1A)."
                }
              }
            ]
          },
          {
            "@type": "HowTo",
            "@id": "https://proptds.fsite.workers.dev/#howto",
            "name": "How to Calculate and Split Form 26QB TDS for Joint Property Owners",
            "step": [
              {
                "@type": "HowToStep",
                "name": "Determine Higher Valuation",
                "text": "Compare Agreement Consideration against the Circle Rate / Stamp Duty valuation. TDS is computed on the higher value."
              },
              {
                "@type": "HowToStep",
                "name": "Calculate Pair-Wise Fractional Shares",
                "text": "Multiply each buyer's percentage share by each seller's percentage share to obtain the pair factor (F_ij)."
              },
              {
                "@type": "HowToStep",

                "text": "Submit distinct Form 26QB challans on e-Pay Tax for each pair and remit 1% TDS."
